# Free Supabase projects pause after 7 days without activity and don't wake on their own.
# Sorena's account deletion needs the apple-token-revoke function, so ping the project every 2 days.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Sorena project's REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pxelaqccqlwkhzleopfg.supabase.co/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered $status"
          test "$status" -lt 500
